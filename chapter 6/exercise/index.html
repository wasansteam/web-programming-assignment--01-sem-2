<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petrol Cost Calculator - Chapter 5</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-card">
        <h2>Petrol Calculator</h2>
        
        <!-- Input for cost per liter with default 1.72 -->
        <div class="input-group">
            <label for="pricePerLiter">Cost per Liter (£)</label>
            <input type="number" id="pricePerLiter" value="1.72" step="0.01">
        </div>

        <!-- Input for total liters with default 0 -->
        <div class="input-group">
            <label for="litersPurchased">Liters Purchased</label>
            <input type="number" id="litersPurchased" value="0" step="0.1">
        </div>

        <!-- Calculation trigger button -->
        <button id="calculateBtn">Calculate Total</button>

        
        <p id="totalDisplay">Total Cost: £0.00</p>
    </div>

    <!-- Updated reference to the JS file -->
    <script src="ch5.js"></script>
</body>
</html>
