<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Petrol Cost Calculator - Chapter 6</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-container">
        <h2>Petrol Calculator</h2>
        
        <div class="form-group">
            <label for="pricePerLiter">Cost per Liter (£)</label>
            <input type="number" id="pricePerLiter" value="1.72" step="0.01">
        </div>

        <div class="form-group">
            <label for="litersPurchased">Liters Purchased</label>
            <input type="number" id="litersPurchased" value="0" step="0.1">
        </div>

        <button id="calculateBtn">Calculate Total</button>

        <p id="totalResult">Total Cost: £0.00</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
