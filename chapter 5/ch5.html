<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Car Showcase</title>
    <style>
        /* Centering the video horizontally and vertically */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a; /* Dark sleek background */
            overflow: hidden;
        }

        .video-wrapper {
            width: 80%;
            max-width: 900px;
            position: relative;
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            display: block;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- 
            - poster: An online image that shows while loading
            - loop: Video repeats automatically
            - muted: Allows the video to play/loop automatically in browsers
            - controls: Adds play/pause and volume buttons
        -->
        <video 
            poster="merc.jpg" 
            loop 
            muted 
            controls>
            <source src="13335120_3840_2160_24fps.mp4" type="video/mp4">
            
        </video>
    </div>

</body>
</html>
