<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nature Texture Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-wrapper">
        <h1>Earth Elements Gallery</h1>

        <div class="gallery-container">
            <div class="card">
                <img src="moss.jpeg" class="moss-border">
                <div class="info">
                    <h3>Forest Moss</h3>
                    <p>Nature's velvet carpet</p>
                </div>
            </div>

            <div class="card">
                <img src="sand.jpeg" class="sand-border">
                <div class="info">
                    <h3>Desert Sand</h3>
                    <p>Wind-swept ridges</p>
                </div>
            </div>

            <div class="card">
                <img src="water.jpeg">
                <div class="info">
                    <h3>Clear Water</h3>
                    <p>Pure liquid ripples</p>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
